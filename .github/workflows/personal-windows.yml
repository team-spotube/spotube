# Personal build: the Windows installer only.
# Upstream's Release workflow builds the WebView libraries for every OS (Linux, macOS, Windows) before any
# app build, because one shared library jar has to carry them all. A Windows-only build only needs the
# Windows one, so this skips the Linux jobs. The library itself must still be published from macOS
# (it declares iOS targets), exactly as upstream does. Kept as a separate file so upstream's workflows
# merge untouched.
name: Personal Windows build

# Runs by itself on every push to the theme branch (so a fix pushed there rebuilds), or by hand.
on:
  push:
    branches: [feishin-theme]
  workflow_dispatch:

concurrency:
  group: personal-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same pin as spotube-release-binary.yml; update both together.
  COMPOSE_WEBVIEW_REPO: KRTirtho/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: b11ac748de1219f9432338c067a2c5dafef3072a

jobs:
  webview-native:
    name: WebView native (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: compose-webview

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build Windows WebView native library
        working-directory: compose-webview
        shell: cmd
        run: webview-compose\src\jvmMain\native\windows\build.bat

      - name: Upload WebView native library
        uses: actions/upload-artifact@v7
        with:
          name: webview-natives-windows-x64
          path: compose-webview/webview-compose/src/jvmMain/resources/nucleus/native/
          retention-days: 1

  prepare-deps:
    name: Prepare dependencies (macOS)
    needs: webview-native
    runs-on: macos-latest
    steps:
      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v7
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: compose-webview

      # Downloaded after checkout, so they are newer than the native sources and
      # the build keeps them instead of trying to rebuild on the wrong OS.
      - name: Download WebView native library
        uses: actions/download-artifact@v8
        with:
          pattern: webview-natives-*
          merge-multiple: true
          path: compose-webview/webview-compose/src/jvmMain/resources/nucleus/native

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Check the Windows WebView library is in the jar
        run: |
          jar=$(ls ~/.m2/repository/dev/nucleusframework/composewebview-jvm/*/composewebview-jvm-*.jar | grep -v -e sources -e javadoc | head -1)
          contents=$(unzip -l "$jar")
          for f in win32-x64/compose_webview_windows.dll win32-x64/WebView2Loader.dll; do
            grep -q "nucleus/native/$f" <<< "$contents" || { echo "::error::$jar is missing $f"; exit 1; }
          done

      - name: Upload maven local
        uses: actions/upload-artifact@v7
        with:
          name: maven-local
          path: ~/.m2/repository/
          retention-days: 1

  windows:
    name: Windows installer
    needs: prepare-deps
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Download maven local
        uses: actions/download-artifact@v8
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # native-image links with MSVC
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GraalVM toolchain
        uses: actions/cache@v6
        with:
          path: ~/.gradle/nucleus/graalvm
          key: graalvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'composeApp/build.gradle.kts') }}
          restore-keys: graalvm-${{ runner.os }}-${{ runner.arch }}-

      - name: Package EXE
        env:
          # Nucleus lists GraalVM CE releases via the GitHub API; unauthenticated calls hit the 60/hour limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :composeApp:packageGraalvmExe -Pnightly=true -PbuildNumber=${{ github.run_number }}

      - name: Rename Windows artifacts
        shell: pwsh
        run: |
          $EXE_FILE = Get-ChildItem -Path composeApp/build/compose/binaries/main/graalvm-exe -Filter "*.exe" |
            Where-Object { $_.Name -notlike '__*' } | Select-Object -First 1
          Copy-Item $EXE_FILE.FullName Spotube-Personal-windows-x86_64-setup.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: Spotube-Personal-windows-x86_64-setup.exe
