name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - nightly
      dry_run:
        description: 'Dry run (build & upload artifacts only, skip creating release)'
        required: false
        type: boolean
        default: false
      debug_ssh:
        description: 'Enable SSH debug session on failure (tmate)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_WEBVIEW_REPO: kdroidFilter/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: 5aeb268a2c37ff4dbfb76924573344a7c4f763ce
  GRADLE_PLUGIN_REPO: team-spotube/gradle-plugin
  VLCJ_BUNDLER_REPO: team-spotube/vlcj-bundler-gradle-plugin

jobs:
  prepare-deps:
    name: Prepare Dependencies
    runs-on: macos-latest
    steps:
      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: compose-webview

      - name: Checkout gradle-plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GRADLE_PLUGIN_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: gradle-plugin

      - name: Checkout vlcj-bundler
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VLCJ_BUNDLER_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: vlcj-bundler

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish compose-webview to mavenLocal
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Publish gradle-plugin to mavenLocal
        working-directory: gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Publish vlcj-bundler to mavenLocal
        working-directory: vlcj-bundler
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Upload maven local
        uses: actions/upload-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

  build-android:
    name: Android
    needs: prepare-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download maven local
        uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > "${{ github.workspace }}/composeApp/upload-keystore.jks"

      - name: Configure Android signing
        working-directory: composeApp
        run: |
          cat >> local.properties <<EOF
          release.signing.storeFile=${{ github.workspace }}/composeApp/upload-keystore.jks
          release.signing.storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          release.signing.keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          release.signing.keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Assemble Release
        run: ./gradlew :composeApp:assembleRelease

      - name: Rename APK
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk/release -name "*.apk" -type f | head -1)
          cp "$APK_FILE" Spotube-android-all-arch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Spotube-android-all-arch.apk

      - name: Setup tmate session on failure
        if: ${{ inputs.debug_ssh && failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  build-linux:
    name: Linux Desktop
    needs: prepare-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download maven local
        uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fuse

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package Linux
        run: ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseRpm

      - name: Rename Linux artifacts
        run: |
          DEB_FILE=$(find composeApp/build -name "*.deb" -type f | head -1)
          RPM_FILE=$(find composeApp/build -name "*.rpm" -type f | head -1)
          cp "$DEB_FILE" Spotube-linux-x86_64.deb
          cp "$RPM_FILE" Spotube-linux-x86_64.rpm

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: Spotube-linux-x86_64.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: Spotube-linux-x86_64.rpm

      - name: Setup tmate session on failure
        if: ${{ inputs.debug_ssh && failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  build-linux-arm64:
    name: Linux Desktop (aarch64)
    needs: prepare-deps
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download maven local
        uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fuse

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package Linux
        run: ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseRpm

      - name: Rename Linux artifacts
        run: |
          DEB_FILE=$(find composeApp/build -name "*.deb" -type f | head -1)
          RPM_FILE=$(find composeApp/build -name "*.rpm" -type f | head -1)
          cp "$DEB_FILE" Spotube-linux-aarch64.deb
          cp "$RPM_FILE" Spotube-linux-aarch64.rpm

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-arm64
          path: Spotube-linux-aarch64.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-arm64
          path: Spotube-linux-aarch64.rpm

      - name: Setup tmate session on failure
        if: ${{ inputs.debug_ssh && failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  build-windows:
    name: Windows Desktop
    needs: prepare-deps
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download maven local
        uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package EXE
        run: ./gradlew :composeApp:packageReleaseExe

      - name: Rename Windows artifacts
        shell: pwsh
        run: |
          $EXE_FILE = Get-ChildItem -Path composeApp/build -Filter "*.exe" -Recurse | Select-Object -First 1
          Copy-Item $EXE_FILE.FullName Spotube-windows-x86_64-setup.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Spotube-windows-x86_64-setup.exe

      - name: Setup tmate session on failure
        if: ${{ inputs.debug_ssh && failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  build-macos:
    name: macOS Desktop
    needs: prepare-deps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download maven local
        uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package DMG
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Rename macOS artifact
        run: |
          DMG_FILE=$(find composeApp/build -name "*.dmg" -type f | head -1)
          cp "$DMG_FILE" Spotube-macos-universal.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Spotube-macos-universal.dmg

      - name: Setup tmate session on failure
        if: ${{ inputs.debug_ssh && failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  create-release:
    name: Create GitHub Release
    if: ${{ !inputs.dry_run }}
    needs:
      - build-android
      - build-linux
      - build-linux-arm64
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set release variables
        id: vars
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            VERSION=$(grep 'versionName' composeApp/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
            TAG="v${VERSION}"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Spotube ${TAG}" >> "$GITHUB_OUTPUT"
          else
            TAG="nightly"
            VERSION="$(date +%Y-%m-%d)"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
            echo "release_name=Nightly ${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate release notes
        run: |
          echo "## Downloads" > release-notes.md
          echo "" >> release-notes.md
          for dir in android-apk android-aab linux-deb linux-rpm linux-appimage linux-deb-arm64 linux-rpm-arm64 windows-msi windows-exe macos-dmg; do
            if [ -d "$dir" ]; then
              echo "### $dir" >> release-notes.md
              for f in "$dir"/*; do
                echo "- \`$(basename "$f")\`" >> release-notes.md
              done
              echo "" >> release-notes.md
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          body_path: release-notes.md
          draft: ${{ steps.vars.outputs.is_draft }}
          prerelease: ${{ steps.vars.outputs.is_prerelease }}
          files: |
            android-apk/*.apk
            android-aab/*.aab
            linux-deb/*.deb
            linux-rpm/*.rpm
            linux-appimage/*.AppImage
            linux-deb-arm64/*.deb
            linux-rpm-arm64/*.rpm
            windows-msi/*.msi
            windows-exe/*.exe
            macos-dmg/*.dmg
